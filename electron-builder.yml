appId: com.oplforge.app
productName: OPL Forge
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
icon: build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  executableName: OPL Forge
  artifactName: OPL-Forge-${env.OPL_PUBLIC_VERSION}-${arch}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: theguitarvity
  repo: src-app-oplforge
  releaseType: release
mac:
  artifactName: OPL-Forge-${env.OPL_PUBLIC_VERSION}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  artifactName: OPL-Forge-${env.OPL_PUBLIC_VERSION}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
  category: Utility
