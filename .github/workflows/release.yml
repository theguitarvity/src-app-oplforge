name: Public release
on:
  push:
    tags: ['v1.*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      public_version: ${{ steps.identity.outputs.opl_public_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: identity
        run: pnpm exec tsx scripts/validate-release.ts
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build
  windows:
    needs: validate
    runs-on: windows-latest
    env:
      OPL_PUBLIC_VERSION: ${{ needs.validate.outputs.public_version }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require signing secrets
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
      - run: pnpm exec tsx scripts/validate-artifacts.ts release
      - shell: pwsh
        run: pnpm exec tsx scripts/verify-signatures.ts public "release/OPL-Forge-$env:OPL_PUBLIC_VERSION-x64-Setup.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: public-windows
          if-no-files-found: error
          path: |
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-x64-Setup.exe
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-x64-Setup.exe.blockmap
            release/latest.yml
            release/artifact-inventory.json
  publish:
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v6
        with: { name: public-windows, path: release }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-x64-Setup.exe
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-x64-Setup.exe.blockmap
            release/latest.yml
            release/artifact-inventory.json
