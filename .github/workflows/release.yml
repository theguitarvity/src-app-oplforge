name: Public release
on:
  push:
    tags: ['v1.*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      public_version: ${{ steps.identity.outputs.opl_public_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: identity
        run: pnpm exec tsx scripts/validate-release.ts
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build
  windows:
    needs: validate
    runs-on: windows-latest
    env:
      OPL_PUBLIC_VERSION: ${{ needs.validate.outputs.public_version }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require signing secrets
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
      - run: pnpm exec tsx scripts/validate-artifacts.ts release windows
      - shell: pwsh
        run: pnpm exec tsx scripts/verify-signatures.ts public "release/OPL-Forge-$env:OPL_PUBLIC_VERSION-x64-Setup.exe"
      - shell: bash
        run: mv release/artifact-inventory.json release/artifact-inventory-windows.json
      - uses: actions/upload-artifact@v6
        with:
          name: public-windows
          if-no-files-found: error
          path: |
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-x64-Setup.exe
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-x64-Setup.exe.blockmap
            release/latest.yml
            release/artifact-inventory-windows.json
  macos:
    needs: validate
    runs-on: macos-latest
    env:
      OPL_PUBLIC_VERSION: ${{ needs.validate.outputs.public_version }}
      # Signing/notarization are opt-in via repo secrets — until an Apple
      # Developer ID (paid account) is set up and these five secrets exist,
      # this stays exactly as unsigned/unnotarized as it is today (same as
      # the "continuous" test channel), just via a different mechanism
      # (empty CSC_LINK rather than a hardcoded AUTO_DISCOVERY:false). Once
      # they exist, electron-builder signs AND notarizes automatically — no
      # other workflow change needed. Required secrets when ready:
      #   MAC_CSC_LINK               base64 (or file://, or https://) .p12 export of the "Developer ID Application" certificate
      #   MAC_CSC_KEY_PASSWORD       password for that .p12
      #   APPLE_ID                   Apple ID email enrolled in the Developer Program
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID (appleid.apple.com > Sign-In and Security)
      #   APPLE_TEAM_ID              10-character Team ID from developer.apple.com/account
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Disable signing when no certificate secret is configured
        if: env.CSC_LINK == ''
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - run: pnpm exec electron-builder --mac dmg --x64 --arm64 --publish never
      - run: pnpm exec tsx scripts/validate-artifacts.ts release mac
      - run: mv release/artifact-inventory.json release/artifact-inventory-macos.json
      - uses: actions/upload-artifact@v6
        with:
          name: public-macos
          if-no-files-found: error
          path: |
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-mac-x64.dmg
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-mac-arm64.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
            release/artifact-inventory-macos.json
  linux:
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPL_PUBLIC_VERSION: ${{ needs.validate.outputs.public_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
      - run: pnpm exec tsx scripts/validate-artifacts.ts release linux
      - run: mv release/artifact-inventory.json release/artifact-inventory-linux.json
      - uses: actions/upload-artifact@v6
        with:
          name: public-linux
          if-no-files-found: error
          path: |
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-linux-x86_64.AppImage
            release/OPL-Forge-${{ env.OPL_PUBLIC_VERSION }}-linux-amd64.deb
            release/latest-linux.yml
            release/artifact-inventory-linux.json
  publish:
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v6
        with: { name: public-windows, path: release }
      - uses: actions/download-artifact@v6
        with: { name: public-macos, path: release }
      - uses: actions/download-artifact@v6
        with: { name: public-linux, path: release }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-x64-Setup.exe
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-x64-Setup.exe.blockmap
            release/latest.yml
            release/artifact-inventory-windows.json
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-mac-x64.dmg
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-mac-arm64.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
            release/artifact-inventory-macos.json
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-linux-x86_64.AppImage
            release/OPL-Forge-${{ needs.validate.outputs.public_version }}-linux-amd64.deb
            release/latest-linux.yml
            release/artifact-inventory-linux.json
